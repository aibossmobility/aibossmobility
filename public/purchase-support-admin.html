<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Purchase support | AI Boss Mobility</title><style>body{font:18px/1.6 system-ui;background:#f8f5ed;color:#14263d}main{max-width:900px;margin:40px auto;padding:24px}input,button{font:inherit;padding:12px}article{padding:20px;background:white;border:1px solid #ddd;margin:15px 0;overflow-wrap:anywhere}a{color:#087e83}</style><main><a href="/">AI Boss Mobility</a><h1>Purchase support requests</h1><p>Use your existing private back-office access code. Requests here belong only to AI Boss Mobility. Check the receipt and signed agreement in its GoHighLevel location before making changes. Never ask a paid customer to purchase again.</p><form id="login"><label>Private access code <input id="token" type="password" autocomplete="current-password" required></label><button>Load requests</button></form><p id="status" role="status"></p><div id="requests"></div></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status'),container=document.getElementById('requests');container.replaceChildren();try{const response=await fetch('/api/purchase-support',{headers:{'x-admin-token':document.getElementById('token').value}});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to load');status.textContent=data.requests.length+' request(s). Refresh by selecting Load requests.';for(const r of data.requests){const article=document.createElement('article');for(const [label,value] of [['Request',r.id],['Received',r.created_at],['Name',r.name],['Email',r.email],['Issue',r.issue],['Service',r.service],['Details',r.details],['Status',r.status]]){const p=document.createElement('p');p.textContent=label+': '+(value||'—');article.append(p)}container.append(article)}}catch(error){status.textContent=error.message}});</script></html>
